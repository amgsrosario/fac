spring:
  application:
    name: fac
  profiles:
    default: dev
  output:
    ansi:
      enabled: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jackson:
    deserialization:
      fail-on-unknown-properties: true

fac:
  security:
    enabled: ${FAC_SECURITY_ENABLED:true}
    jwt:
      secret: ${FAC_JWT_SECRET:}
      expiration-minutes: ${FAC_JWT_EXPIRATION_MINUTES:60}
  fiscal:
    qr:
      enabled: ${FAC_FISCAL_QR_ENABLED:true}
      # Q/R require the document-bound fiscal signature source; no demo defaults.
